<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.4 system-ui, sans-serif;
      color: #111;
      background: #fff;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .role { font-weight: 700; }
    label { display: block; margin: 10px 0 4px; }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #111;
      font: inherit;
      background: #fff;
    }
    button {
      padding: 8px 12px;
      border: 1px solid #111;
      background: #fff;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .row input { flex: 1; }
    .meta {
      border: 1px solid #111;
      padding: 8px 10px;
      margin: 12px 0;
      background: #fff;
    }
    .meta div { margin: 2px 0; }
    #log {
      border: 1px solid #111;
      min-height: 280px;
      max-height: 50vh;
      overflow: auto;
      padding: 8px 10px;
      margin: 12px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .sys { color: #555; }
    .hidden { display: none; }
    .err { color: #a00; margin-top: 8px; }
    .warn {
      border: 1px solid #111;
      padding: 10px;
      margin-bottom: 12px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>
      <span>Simple Chat</span>
      <span class="role" id="role"></span>
    </h1>
    <div id="fileWarn" class="warn hidden">
      This page was opened as a local file. Use the GitHub Pages https link instead.
    </div>

    <div id="setup">
      <label for="name">Your name</label>
      <input id="name" type="text" maxlength="32" autocomplete="nickname">

      <div class="row">
        <button id="create">Create room</button>
      </div>

      <label for="code">Or join with a room code</label>
      <div class="row">
        <input id="code" type="text" placeholder="paste room code" autocomplete="off" maxlength="12">
        <button id="join">Join</button>
      </div>
      <div class="err" id="setupErr"></div>
    </div>

    <div id="room" class="hidden">
      <div class="meta">
        <div>Room code: <span id="roomCode"></span> <button id="copy">Copy</button></div>
        <div>Host: <span id="hostName">—</span></div>
        <div>People: <span id="people">—</span></div>
        <div id="status">Connecting…</div>
      </div>
      <div id="log"></div>
      <div class="row">
        <input id="msg" type="text" placeholder="Type a message" maxlength="500" disabled>
        <button id="send" disabled>Send</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { joinRoom, selfId } from "https://esm.run/trystero";

    const APP = { appId: "brdvr-small-webrtc-chat" };
    const $ = (id) => document.getElementById(id);

    if (location.protocol === "file:") {
      $("fileWarn").classList.remove("hidden");
    }

    const setupEl = $("setup");
    const roomEl = $("room");
    const roleEl = $("role");
    const logEl = $("log");
    const nameEl = $("name");
    const codeEl = $("code");
    const msgEl = $("msg");
    const setupErr = $("setupErr");
    const roomCodeEl = $("roomCode");
    const hostNameEl = $("hostName");
    const peopleEl = $("people");
    const statusEl = $("status");

    let room = null;
    let sendPacket = null;
    let isHost = false;
    let myName = "";
    let hostName = "";
    let hostId = "";
    let ready = false;
    const names = new Map();

    function cleanName(raw) {
      return String(raw || "").replace(/\s+/g, " ").trim().slice(0, 32);
    }

    function makeCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let out = "";
      for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
      return out;
    }

    function normCode(raw) {
      return String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
    }

    function addLine(text, sys) {
      const div = document.createElement("div");
      if (sys) div.className = "sys";
      div.textContent = text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function peopleText() {
      const list = [];
      const hostLabel = (isHost ? myName : hostName) || "Host";
      list.push(hostLabel + " (host)");
      const seen = new Set([hostLabel]);
      if (!isHost && myName && myName !== hostLabel) {
        list.push(myName);
        seen.add(myName);
      }
      for (const n of names.values()) {
        if (n && !seen.has(n)) {
          list.push(n);
          seen.add(n);
        }
      }
      return list.join(", ");
    }

    function renderMeta() {
      hostNameEl.textContent = (isHost ? myName : hostName) || "—";
      peopleEl.textContent = peopleText();
    }

    function setReady(ok, text) {
      ready = ok;
      statusEl.textContent = text;
      msgEl.disabled = !ok;
      $("send").disabled = !ok;
    }

    function showRoom(code) {
      setupEl.classList.add("hidden");
      roomEl.classList.remove("hidden");
      roleEl.textContent = isHost ? "HOST" : "";
      roomCodeEl.textContent = code;
      renderMeta();
    }

    function fail(msg) {
      setupErr.textContent = msg;
      $("create").disabled = false;
      $("join").disabled = false;
    }

    function packet(obj) {
      if (sendPacket) sendPacket(obj);
    }

    function announceHost(target) {
      const payload = {
        type: "host",
        hostName: myName,
        hostId: selfId,
        people: peopleText()
      };
      if (target) sendPacket(payload, target);
      else packet(payload);
    }

    function onPacket(data, peerId) {
      if (!data || typeof data !== "object") return;

      if (data.type === "hello") {
        const n = cleanName(data.name) || "Guest";
        names.set(peerId, n);
        if (isHost) {
          addLine(n + " joined", true);
          announceHost();
          packet({ type: "sys", text: n + " joined" });
        }
        renderMeta();
        return;
      }

      if (data.type === "host") {
        hostName = cleanName(data.hostName) || hostName;
        hostId = data.hostId || hostId;
        if (!isHost) {
          setReady(true, "Connected");
          roleEl.textContent = "";
          if (hostName && !logEl.dataset.hostTold) {
            addLine(hostName + " is the host", true);
            logEl.dataset.hostTold = "1";
          }
        }
        renderMeta();
        return;
      }

      if (data.type === "sys") {
        addLine(String(data.text || ""), true);
        return;
      }

      if (data.type === "chat") {
        const n = cleanName(data.name) || "Guest";
        const text = String(data.text || "").slice(0, 500);
        if (!text) return;
        if (n === myName && peerId !== selfId) return;
        addLine(n + ": " + text, false);
      }
    }

    async function enterRoom(code, asHost) {
      isHost = asHost;
      hostName = asHost ? myName : "";
      hostId = asHost ? selfId : "";
      names.clear();
      names.set(selfId, myName);

      showRoom(code);
      setReady(false, "Connecting…");
      addLine(asHost ? "Room created. Share the room code." : "Looking for the host…", true);
      if (asHost) addLine(myName + " is the host", true);

      try {
        room = joinRoom(APP, "room-" + code);
      } catch (err) {
        setReady(false, "Could not start room");
        addLine("Could not start room.", true);
        return;
      }

      const actions = room.makeAction("pkt");
      sendPacket = actions[0];
      const getPacket = actions[1];
      getPacket(onPacket);

      room.onPeerJoin((peerId) => {
        packet({ type: "hello", name: myName }, peerId);
        if (isHost) announceHost(peerId);
      });

      room.onPeerLeave((peerId) => {
        const n = names.get(peerId);
        names.delete(peerId);
        if (n) addLine(n + " left", true);
        if (!isHost && peerId === hostId) {
          setReady(false, "Host closed the room");
          addLine("Host closed the room.", true);
        }
        renderMeta();
      });

      packet({ type: "hello", name: myName });
      if (isHost) {
        announceHost();
        setReady(true, "Connected");
      } else {
        window.setTimeout(() => {
          if (!ready) {
            setReady(false, "No host found. Check the code and that the host tab is still open.");
            addLine("No host found yet. Keep this tab open, or ask the host to create the room again.", true);
          }
        }, 12000);
      }
    }

    function sendChat() {
      if (!ready) return;
      const text = msgEl.value.replace(/^\s+|\s+$/g, "");
      if (!text) return;
      msgEl.value = "";
      addLine(myName + ": " + text, false);
      packet({ type: "chat", name: myName, text });
    }

    $("create").onclick = () => {
      setupErr.textContent = "";
      myName = cleanName(nameEl.value);
      if (!myName) return fail("Enter a name first.");
      $("create").disabled = true;
      $("join").disabled = true;
      enterRoom(makeCode(), true);
    };

    $("join").onclick = () => {
      setupErr.textContent = "";
      myName = cleanName(nameEl.value);
      const code = normCode(codeEl.value);
      if (!myName) return fail("Enter a name first.");
      if (code.length < 4) return fail("Paste the full room code.");
      $("create").disabled = true;
      $("join").disabled = true;
      enterRoom(code, false);
    };

    $("send").onclick = sendChat;
    msgEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendChat();
    });
    nameEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("create").click();
    });
    codeEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("join").click();
    });
    $("copy").onclick = async () => {
      const id = roomCodeEl.textContent;
      if (!id) return;
      try {
        await navigator.clipboard.writeText(id);
        $("copy").textContent = "Copied";
        setTimeout(() => { $("copy").textContent = "Copy"; }, 1000);
      } catch (e) {
        prompt("Copy this room code:", id);
      }
    };
  </script>
</body>
</html>
